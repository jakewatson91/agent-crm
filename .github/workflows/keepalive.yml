name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 https://agent-crm-fm1f.onrender.com/api/inngest)
            echo "ping $i: HTTP $code"
            [ "$code" = "401" ] && exit 0
            sleep 5
          done
          exit 1
